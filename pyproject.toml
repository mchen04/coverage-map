[project]
name = "covmap"
version = "0.1.0"
description = "Research-only CT reading-coverage map (not a medical device)"
requires-python = ">=3.11"

[project.scripts]
covmap = "covmap.cli:main"

[tool.pytest.ini_options]
testpaths = ["tests"]
markers = [
  "data: needs a fetched and segmented public case in $COVMAP_DATA",
  "browser: needs the built OHIF app, Orthanc and Chromium",
]
